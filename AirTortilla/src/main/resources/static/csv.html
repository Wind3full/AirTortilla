<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirTortilla · Generar CSV</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="private">
  <div id="app-header"></div>

  <main class="container">
    <section class="panel">
      <h2>Generar ficheros CSV</h2>
      <p>
        Se generará un archivo por cada combinación de país de destino y fecha de reserva.
        Los CSV se descargarán agrupados en un archivo ZIP.
      </p>
      <button id="download-csv">Generar y descargar</button>
      <p id="page-message" class="message" role="status"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
