spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/airtortilla?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:airtortilla}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:airtortilla}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.csv-dir=${CSV_DIR:../res}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
