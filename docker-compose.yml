services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: airtortilla
      MYSQL_USER: airtortilla
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: AirTortilla/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/airtortilla?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: airtortilla
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Define ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD in .env}
      CSV_DIR: /data/csv
    ports:
      - "8080:8080"
    volumes:
      - ./res:/data/csv:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
